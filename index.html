<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Home Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            /* Sets your uploaded image as the exact background */
            background: url('smart-home-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Status Header at the top */
        .status-header {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center;
            background: rgba(0, 0, 0, 0.4); border-radius: 12px;
            padding: 8px 16px; backdrop-filter: blur(5px); z-index: 900;
            color: white; border: 1px solid rgba(255,255,255,0.2);
        }
        .main-title { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .status-text { font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; margin-top: 2px; }
        .dot { height: 7px; width: 7px; border-radius: 50%; margin-right: 6px; }
        .dot-green { background-color: #34d399; box-shadow: 0 0 8px #34d399; }
        .dot-red { background-color: #ef4444; }

        /* Interactive Clickable Light Bulb positioned over the image */
        .device-lamp {
            position: absolute;
            bottom: 25%; /* Adjust these percentages to match */
            right: 28%;  /* the lightbulb location on your specific background image */
            width: 50px; height: 50px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s ease;
            z-index: 10;
        }

        .device-lamp:active { transform: scale(0.9); }
        
        /* When Light is ON, make it glow brightly */
        .device-lamp.active {
            background-color: #fef08a;
            box-shadow: 0 0 25px #fde047, 0 0 40px #eab308;
            border-color: #facc15;
        }
    </style>
</head>
<body>

    <!-- Status UI -->
    <div class="status-header">
        <span class="main-title">Smart Home Control</span>
        <div id="status" class="status-text"><div class="dot dot-red"></div>Connecting...</div>
    </div>

    <!-- Interactive ESP32 Lamp Button placed directly on the graphic -->
    <div id="device-lamp" class="device-lamp" onclick="toggleLamp()" title="Click to toggle lamp">💡</div>

    <script>
        const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "/mqtt", "web_cartoon_" + parseInt(Math.random() * 100000));
        let lampState = "OFF";

        const statusEl = document.getElementById("status");
        const lampEl = document.getElementById("device-lamp");

        client.onConnectionLost = function(responseObject) {
            statusEl.innerHTML = '<div class="dot dot-red"></div>Disconnected';
            lampEl.classList.remove('active');
        };

        client.onMessageArrived = function(message) {
            lampState = message.payloadString;
            updateUI();
        };

        client.connect({
            useSSL: true,
            timeout: 5,
            onSuccess: function() {
                statusEl.innerHTML = '<div class="dot dot-green"></div>Connected Online';
                client.subscribe("samnang/smarthome/led/status");
            },
            onFailure: function(err) {
                statusEl.innerHTML = '<div class="dot dot-red"></div>Connection Failed';
            }
        });

        function toggleLamp() {
            let nextState = (lampState === "OFF") ? "ON" : "OFF";
            let msg = new Paho.MQTT.Message(nextState);
            msg.destinationName = "samnang/smarthome/led";
            client.send(msg);
        }

        function updateUI() {
            if (lampState === "ON") {
                lampEl.classList.add('active');
            } else {
                lampEl.classList.remove('active');
            }
        }
    </script>
</body>
</html>
