<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Home Cartoon Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1b8fb0 0%, #30acc9 70%, #6cd2ea 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Status & Info Header */
        .status-header {
            position: absolute; top: 15px;
            display: flex; flex-direction: column; align-items: center;
            background: rgba(0, 0, 0, 0.35); border-radius: 16px;
            padding: 10px 20px; backdrop-filter: blur(6px); z-index: 100;
            color: white; border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            min-width: 240px;
        }
        .main-title { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .datetime-info { font-size: 0.8rem; font-weight: 500; opacity: 0.9; margin: 2px 0; }
        .weather-info { font-size: 0.85rem; font-weight: 600; color: #fde047; margin-bottom: 4px; }
        .status-text { font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; }
        .dot { height: 7px; width: 7px; border-radius: 50%; margin-right: 6px; }
        .dot-green { background-color: #34d399; box-shadow: 0 0 8px #34d399; }
        .dot-red { background-color: #ef4444; }

        /* Cartoon House Container */
        .house-container {
            position: relative;
            width: 90%;
            max-width: 420px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .house-container:active { transform: scale(0.97); }

        /* SVG Styling & Dynamic Lighting States */
        svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.2));
        }

        /* OFF State (Default Darker/Dim House) */
        .window-pane { fill: #475569; transition: 0.4s ease; }
        .house-body { fill: #f3f4f6; transition: 0.4s ease; }
        .roof { fill: #334155; transition: 0.4s ease; }
        .glow-effect { opacity: 0; transition: 0.4s ease; }

        /* ON State (Warm Glowing House) */
        .house-on .window-pane { fill: #fde047; filter: drop-shadow(0 0 12px #facc15); }
        .house-on .house-body { fill: #fffbeb; }
        .house-on .roof { fill: #475569; }
        .house-on .glow-effect { opacity: 1; }

        /* Instruction text below house */
        .hint-text {
            margin-top: 20px;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            background: rgba(0,0,0,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <!-- Status & Weather Header -->
    <div class="status-header">
        <span class="main-title">Smart Home Control</span>
        <div class="datetime-info" id="datetimeDisplay">Loading Date & Time...</div>
        <div class="weather-info" id="weatherDisplay">🌤️ Loading Weather...</div>
        <div id="status" class="status-text"><div class="dot dot-red"></div>Connecting Cloud...</div>
    </div>

    <!-- Interactive Cartoon House -->
    <div class="house-container" id="houseCard" onclick="toggleLight()">
        <svg id="houseSvg" viewBox="0 0 400 350" xmlns="http://www.w3.org/2000/svg">
            <circle class="glow-effect" cx="200" cy="180" r="140" fill="#fef08a" opacity="0.4" filter="blur(30px)"/>
            <polygon class="roof" points="200,40 60,130 340,130"/>
            <polygon class="roof" points="200,40 340,130 320,130 200,55" fill="#64748b" opacity="0.4"/>
            <rect class="house-body" x="90" y="130" width="220" height="170" rx="6"/>
            <rect x="175" y="210" width="50" height="90" rx="4" fill="#b45309"/>
            <circle cx="215" cy="255" r="4" fill="#fbbf24"/>
            <rect x="115" y="150" width="50" height="50" rx="6" fill="#1e293b"/>
            <rect class="window-pane" x="123" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="141" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="123" y="176" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="141" y="176" width="16" height="16" rx="2"/>
            <rect x="235" y="150" width="50" height="50" rx="6" fill="#1e293b"/>
            <rect class="window-pane" x="243" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="261" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="243" y="176" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="261" y="176" width="16" height="16" rx="2"/>
            <rect x="270" y="70" width="25" height="45" rx="3" fill="#94a3b8"/>
        </svg>
    </div>

    <div class="hint-text" id="hintText">Tap house to TURN ON 💡</div>

    <script>
        // --- Live Clock & Date Script ---
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            const dateStr = now.toLocaleDateString('en-US', options);
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById("datetimeDisplay").innerText = `${dateStr} | ${timeStr}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // --- Live Weather Fetcher (Auto Geolocation) ---
        async function fetchWeather() {
            try {
                // Get user's coordinates automatically
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const data = await res.json();
                    const temp = data.current_weather.temperature;
                    document.getElementById("weatherDisplay").innerText = `🌡️ Local Weather: ${temp}°C`;
                }, () => {
                    // Fallback default if location is blocked
                    document.getElementById("weatherDisplay").innerText = `🌡️ Weather: 28°C`;
                });
            } catch (e) {
                document.getElementById("weatherDisplay").innerText = `🌡️ Weather Available`;
            }
        }
        fetchWeather();

        // --- MQTT Cloud Connection ---
        const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "/mqtt", "web_cartoon_" + parseInt(Math.random() * 100000));
        let lightState = "OFF";

        const statusEl = document.getElementById("status");
        const houseCard = document.getElementById("houseCard");
        const hintText = document.getElementById("hintText");

        client.onConnectionLost = function(responseObject) {
            statusEl.innerHTML = '<div class="dot dot-red"></div>Disconnected';
        };

        client.onMessageArrived = function(message) {
            lightState = message.payloadString;
            updateUI();
        };

        client.connect({
            useSSL: true,
            timeout: 5,
            onSuccess: function() {
                statusEl.innerHTML = '<div class="dot dot-green"></div>Connected Online';
                client.subscribe("samnang/smarthome/led/status");
            },
            onFailure: function(err) {
                statusEl.innerHTML = '<div class="dot dot-red"></div>Connection Failed';
            }
        });

        function toggleLight() {
            let nextState = (lightState === "OFF") ? "ON" : "OFF";
            let msg = new Paho.MQTT.Message(nextState);
            msg.destinationName = "samnang/smarthome/led";
            client.send(msg);
        }

        function updateUI() {
            if (lightState === "ON") {
                houseCard.classList.add("house-on");
                hintText.innerText = "House is ON ✨ (Tap to turn OFF)";
            } else {
                houseCard.classList.remove("house-on");
                hintText.innerText = "House is OFF 🌙 (Tap to turn ON)";
            }
        }
    </script>
</body>
</html>
