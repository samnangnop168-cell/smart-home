<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Next-Gen Smart Home HUD</title> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: #090d16;
            color: #ffffff;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow: hidden; touch-action: manipulation;
        }

        /* Dynamic Animated Background Grid & Glow */
        #bgCanvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .bg-glow {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2; pointer-events: none; transition: background 0.8s ease;
        }

        body.light-active .bg-glow {
            background: radial-gradient(circle, rgba(250, 204, 21, 0.2) 0%, rgba(0,0,0,0) 70%);
        }

        /* Header Bar */
        .top-header {
            position: absolute; top: 20px; z-index: 100;
            display: flex; flex-direction: column; align-items: center;
            background: rgba(15, 23, 42, 0.65); padding: 8px 24px;
            border-radius: 16px; backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .status-text {
            font-size: 0.75rem; font-weight: 600;
            display: flex; align-items: center; margin-top: 3px; color: #94a3b8;
        }
        .dot { height: 8px; width: 8px; border-radius: 50%; margin-right: 6px; }
        .dot-green { background-color: #10b981; box-shadow: 0 0 10px #10b981; }
        .dot-red { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }

        /* Side HUD Widgets */
        .side-card {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.6); padding: 16px 20px;
            border-radius: 18px; backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; z-index: 90;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            min-width: 140px;
        }
        .left-card { left: 30px; }
        .right-card { right: 30px; }

        .card-label {
            font-size: 0.7rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px; color: #64748b;
        }
        .card-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem; font-weight: 700; margin-top: 6px; color: #38bdf8;
        }

        /* Center Isometric Smart Villa */
        .house-container {
            position: relative; z-index: 10;
            width: 88%; max-width: 520px; cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .house-container:hover { transform: scale(1.02); }
        .house-container:active { transform: scale(0.97); }

        svg { width: 100%; height: auto; filter: drop-shadow(0 20px 35px rgba(0,0,0,0.6)); }

        /* SVG Isometric House Styling */
        .iso-wall-dark { fill: #1e293b; transition: fill 0.5s ease; }
        .iso-wall-light { fill: #334155; transition: fill 0.5s ease; }
        .iso-roof-left { fill: #0f172a; transition: fill 0.5s ease; }
        .iso-roof-right { fill: #1e293b; transition: fill 0.5s ease; }
        .iso-glass { fill: rgba(56, 189, 248, 0.15); stroke: rgba(56, 189, 248, 0.4); stroke-width: 1.5; transition: all 0.5s ease; }
        
        /* Light Turned OFF State */
        .glow-layer { opacity: 0; transition: opacity 0.5s ease; }
        .puppy-awake { opacity: 0; transition: opacity 0.3s ease; }
        .puppy-sleep { opacity: 1; transition: opacity 0.3s ease; }
        .butterfly { opacity: 0; transition: opacity 0.3s ease; }

        /* Light Turned ON State */
        body.light-active .iso-glass {
            fill: rgba(250, 204, 21, 0.85);
            stroke: #fef08a;
            filter: drop-shadow(0 0 15px rgba(250, 204, 21, 0.8));
        }
        body.light-active .iso-wall-dark { fill: #334155; }
        body.light-active .iso-wall-light { fill: #475569; }
        body.light-active .glow-layer { opacity: 1; }
        body.light-active .puppy-awake { opacity: 1; }
        body.light-active .puppy-sleep { opacity: 0; }
        body.light-active .butterfly { opacity: 1; animation: flyButterfly 4s infinite ease-in-out; }

        /* HD Pet & Butterfly Animations */
        .sleep-z { animation: floatZ 2s infinite ease-in-out; }
        @keyframes floatZ {
            0% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
            50% { transform: translateY(-12px) scale(1.15); opacity: 1; }
            100% { transform: translateY(-24px) scale(0.9); opacity: 0; }
        }
        .dog-tail { transform-origin: 395px 235px; animation: dogTailWag 0.35s infinite alternate ease-in-out; }
        @keyframes dogTailWag { 0% { transform: rotate(-10deg); } 100% { transform: rotate(35deg); } }

        @keyframes flyButterfly {
            0% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
            25% { transform: translate(25px, -25px) scale(1.1) rotate(15deg); }
            50% { transform: translate(45px, -10px) scale(0.95) rotate(-10deg); }
            75% { transform: translate(20px, 15px) scale(1.05) rotate(5deg); }
            100% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
        }
        .wing-left { transform-origin: 342px 170px; animation: flapLeft 0.18s infinite alternate ease-in-out; }
        .wing-right { transform-origin: 354px 170px; animation: flapRight 0.18s infinite alternate ease-in-out; }
        @keyframes flapLeft { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(65deg); } }
        @keyframes flapRight { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(-65deg); } }

        /* Bottom Controls */
        .voice-btn {
            position: absolute; bottom: 80px; z-index: 100;
            background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            color: #ffffff; border: none; padding: 12px 28px;
            border-radius: 30px; font-weight: 600; font-size: 0.85rem;
            letter-spacing: 0.5px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
            transition: all 0.2s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .voice-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(56, 189, 248, 0.5); }
        .voice-btn:active { transform: scale(0.95); }

        .hint-text {
            position: absolute; bottom: 25px; z-index: 100;
            color: #cbd5e1; font-weight: 600; font-size: 0.88rem;
            background: rgba(15, 23, 42, 0.65); padding: 10px 24px;
            border-radius: 30px; backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* Mobile Layout Adjustment */
        @media (max-width: 600px) {
            .side-card { top: auto; bottom: 125px; transform: none; padding: 10px 14px; min-width: 120px; }
            .left-card { left: 15px; }
            .right-card { right: 15px; }
            .card-value { font-size: 0.85rem; }
            .card-label { font-size: 0.6rem; }
            .voice-btn { bottom: 75px; padding: 10px 22px; }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>
    <div class="bg-glow"></div>

    <!-- Top Status Header -->
    <div class="top-header">
        <span class="main-title">Smart Home HUD</span>
        <div id="status" class="status-text"><div class="dot dot-red"></div>Connecting...</div>
    </div>

    <!-- Left Card: Clock & Date -->
    <div class="side-card left-card">
        <div class="card-label">📅 System Time</div>
        <div class="card-value" id="dateDisplay">-- --- ----</div>
        <div class="card-value" id="timeDisplay" style="color: #ffffff; margin-top: 2px;">--:--:--</div>
    </div>

    <!-- Right Card: Temperature -->
    <div class="side-card right-card">
        <div class="card-label">🌡️ Environment</div>
        <div class="card-value" id="weatherDisplay">--°C</div>
    </div>

    <!-- Center Futuristic Isometric Smart Villa -->
    <div class="house-container" id="houseCard" onclick="toggleLight()">
        <svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="12" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
                <linearGradient id="furGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f59e0b"/>
                    <stop offset="100%" stop-color="#d97706"/>
                </linearGradient>
                <linearGradient id="butterflyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f43f5e"/>
                    <stop offset="50%" stop-color="#ec4899"/>
                    <stop offset="100%" stop-color="#8b5cf6"/>
                </linearGradient>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
            </defs>

            <!-- Ground Base Grid -->
            <polygon points="250,370 450,270 250,170 50,270" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
            <polygon points="250,370 450,270 450,280 250,380" fill="#020617"/>
            <polygon points="250,370 50,270 50,280 250,380" fill="#0f172a"/>

            <!-- Main Building Structure -->
            <!-- Left Side Wall -->
            <polygon class="iso-wall-dark" points="120,230 250,295 250,160 120,95"/>
            <!-- Right Side Wall -->
            <polygon class="iso-wall-light" points="250,295 380,230 380,95 250,160"/>
            
            <!-- Roof -->
            <polygon class="iso-roof-left" points="110,90 250,155 250,145 110,80"/>
            <polygon class="iso-roof-right" points="250,155 390,85 390,75 250,145"/>
            <polygon points="110,80 250,10 390,75 250,145" fill="#1e293b"/>

            <!-- Solar Panels / Tech Accent on Roof -->
            <polygon points="160,75 250,35 300,58 210,98" fill="#0284c7" opacity="0.6"/>
            <line x1="205" y1="55" x2="255" y2="78" stroke="#38bdf8" stroke-width="1"/>

            <!-- Smart Glass Windows & Light Emitters -->
            <!-- Ground Floor Windows (Left) -->
            <polygon class="iso-glass" points="140,205 230,250 230,210 140,165"/>
            <!-- Upper Floor Windows (Right) -->
            <polygon class="iso-glass" points="270,235 360,190 360,145 270,190"/>
            <!-- Front Entrance Glass Door -->
            <polygon class="iso-glass" points="265,280 300,262 300,215 265,232"/>

            <!-- Ambient Light Aura Emitter (Active when ON) -->
            <g class="glow-layer">
                <ellipse cx="250" cy="290" rx="120" ry="60" fill="#fef08a" opacity="0.3" filter="url(#yellowGlow)"/>
                <polygon points="140,205 230,250 230,210 140,165" fill="#fde047" opacity="0.9" filter="url(#yellowGlow)"/>
                <polygon points="270,235 360,190 360,145 270,190" fill="#fde047" opacity="0.9" filter="url(#yellowGlow)"/>
            </g>

            <!-- Hologram Status Light Badge above House -->
            <g transform="translate(250, 45)">
                <ellipse cx="0" cy="0" rx="40" ry="12" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="1.5"/>
                <circle cx="-18" cy="0" r="4" fill="#10b981"/>
                <text x="2" y="4" font-family="'Orbitron', sans-serif" font-size="10" fill="#ffffff" font-weight="bold">ONLINE</text>
            </g>

            <!-- HD SLEEPING PUPPY -->
            <g class="puppy-sleep" transform="translate(365, 230)">
                <ellipse cx="12" cy="15" rx="22" ry="14" fill="url(#furGradient)"/>
                <circle cx="-6" cy="11" r="12" fill="url(#furGradient)"/>
                <ellipse cx="-13" cy="14" rx="6" ry="4" fill="#fde68a"/>
                <path d="M -7 -2 Q -18 3 -12 13 Z" fill="#b45309"/>
                <path d="M -9 8 Q -6 11 -3 8" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
                <circle cx="-15" cy="12" r="1.5" fill="#451a03"/>
                <text x="-12" y="-10" fill="#ffffff" font-size="13" font-weight="bold" class="sleep-z" filter="url(#glow)">Z</text>
                <text x="2" y="-22" fill="#ffffff" font-size="11" font-weight="bold" class="sleep-z" style="animation-delay: 0.7s;" filter="url(#glow)">z</text>
            </g>

            <!-- HD AWAKE PUPPY -->
            <g class="puppy-awake" transform="translate(370, 215)">
                <path class="dog-tail" d="M 25 20 Q 43 8 38 -8" stroke="#d97706" stroke-width="6" stroke-linecap="round" fill="none"/>
                <ellipse cx="10" cy="15" rx="16" ry="18" fill="url(#furGradient)"/>
                <path d="M -1 2 Q 10 14 21 2 Z" fill="#ffffff"/>
                <circle cx="10" cy="-8" r="15" fill="url(#furGradient)"/>
                <path d="M -4 -18 Q -13 -35 0 -22 Z" fill="#b45309"/>
                <path d="M 24 -18 Q 33 -35 20 -22 Z" fill="#b45309"/>
                <circle cx="3" cy="-10" r="3.5" fill="#1e293b"/>
                <circle cx="2" cy="-12" r="1.2" fill="#ffffff"/>
                <circle cx="17" cy="-10" r="3.5" fill="#1e293b"/>
                <circle cx="16" cy="-12" r="1.2" fill="#ffffff"/>
                <ellipse cx="10" cy="-3" rx="3.5" ry="2.5" fill="#1e293b"/>
                <path d="M 6 2 Q 10 8 14 2" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                <path d="M 8 3 Q 10 9 12 3 Z" fill="#f43f5e"/>
            </g>

            <!-- HD GLOWING BUTTERFLY -->
            <g class="butterfly" filter="url(#glow)" transform="translate(10, 40)">
                <g class="wing-left">
                    <path d="M 342 170 Q 321 155 324 173 Q 321 185 342 180 Z" fill="url(#butterflyGrad)" opacity="0.9"/>
                    <circle cx="331" cy="169" r="2.5" fill="#fde047"/>
                </g>
                <g class="wing-right">
                    <path d="M 342 170 Q 363 155 360 173 Q 363 185 342 180 Z" fill="url(#butterflyGrad)" opacity="0.9"/>
                    <circle cx="353" cy="169" r="2.5" fill="#fde047"/>
                </g>
                <ellipse cx="342" cy="172" rx="2" ry="8" fill="#1e293b"/>
                <path d="M 342 163 Q 338 157 334 159" stroke="#1e293b" stroke-width="1.5" fill="none"/>
                <path d="M 342 163 Q 346 157 350 159" stroke="#1e293b" stroke-width="1.5" fill="none"/>
            </g>
        </svg>
    </div>

    <!-- Voice Control Button & Status -->
    <button class="voice-btn" onclick="startListening()">
        <span>🎤</span>
        <span>VOICE COMMAND</span>
    </button>
    <div class="hint-text" id="hintText">System: Synchronizing...</div>

    <script>
        // --- Dynamic Particle Canvas Background ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = `rgba(56, 189, 248, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 45; i++) { particles.push(new Particle()); }

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // --- Text-to-Speech Voice Report Function ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- Speech Recognition (Voice Commands & Questions) ---
        let recognition;
        let waitingForConfirmation = false;

        function initVoiceRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (window.SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onresult = function(event) {
                    let speechWord = event.results[0][0].transcript.toLowerCase().trim();
                    console.log("Heard speech: " + speechWord);
                    
                    if (speechWord.includes("light on") || speechWord.includes("turn on")) {
                        waitingForConfirmation = true;
                        sendMQTTCommand("ON");
                    } 
                    else if (speechWord.includes("light off") || speechWord.includes("turn off")) {
                        waitingForConfirmation = true;
                        sendMQTTCommand("OFF");
                    } 
                    else if (speechWord.includes("status") || speechWord.includes("is the light") || speechWord.includes("light condition")) {
                        if (lightState === "ON") {
                            speak("The light is currently turned on.");
                        } else if (lightState === "OFF") {
                            speak("The light is currently turned off.");
                        } else {
                            speak("Status is currently unknown.");
                        }
                    } 
                    else {
                        speak("Command not recognized. Say light on, light off, or check status.");
                    }
                };

                recognition.onerror = function(event) {
                    console.log("Speech recognition error", event.error);
                };
            }
        }

        function startListening() {
            if (recognition) {
                try {
                    recognition.start();
                    speak("Listening");
                } catch(e) { console.log(e); }
            } else {
                alert("Speech recognition is not supported in this browser. Try Google Chrome.");
            }
        }

        initVoiceRecognition();

        // --- Live Clock & Date Script ---
        function updateDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById("dateDisplay").innerText = dateStr;
            document.getElementById("timeDisplay").innerText = timeStr;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // --- Live Weather Fetcher ---
        async function fetchWeather() {
            try {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const data = await res.json();
                    document.getElementById("weatherDisplay").innerText = `${data.current_weather.temperature}°C`;
                }, () => {
                    document.getElementById("weatherDisplay").innerText = "28°C";
                });
            } catch (e) {
                document.getElementById("weatherDisplay").innerText = "28°C";
            }
        }
        fetchWeather();

        // --- MQTT Cloud Connection ---
        const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "/mqtt", "web_cartoon_" + parseInt(Math.random() * 100000));
        let lightState = "UNKNOWN";
        let hasSpokenInitialStatus = false;

        const statusEl = document.getElementById("status");
        const hintText = document.getElementById("hintText");

        client.onConnectionLost = function(responseObject) {
            statusEl.innerHTML = '<div class="dot dot-red"></div>Disconnected';
            hintText.innerText = "System: Offline 🔴";
            speak("System disconnected from cloud network.");
        };

        client.onMessageArrived = function(message) {
            lightState = message.payloadString;
            updateUI();

            if (!hasSpokenInitialStatus) {
                hasSpokenInitialStatus = true;
                if (lightState === "ON") {
                    speak("System connected online. Light is currently turned on.");
                } else {
                    speak("System connected online. Light is currently turned off.");
                }
            } 
            else if (waitingForConfirmation) {
                waitingForConfirmation = false;
                if (lightState === "ON") {
                    speak("Confirmed. Light is now turned on.");
                } else {
                    speak("Confirmed. Light is now turned off.");
                }
            }
        };

        client.connect({
            useSSL: true,
            timeout: 5,
            onSuccess: function() {
                statusEl.innerHTML = '<div class="dot dot-green"></div>Connected Online';
                client.subscribe("samnang/smarthome/led/status");

                let reqMsg = new Paho.MQTT.Message("GET");
                reqMsg.destinationName = "samnang/smarthome/led/get";
                client.send(reqMsg);
            },
            onFailure: function(err) {
                statusEl.innerHTML = '<div class="dot dot-red"></div>Connection Failed';
                hintText.innerText = "System: Connection Error ❌";
                speak("Connection failed. Please check network connection.");
            }
        });

        function toggleLight() {
            let nextState = (lightState === "ON") ? "OFF" : "ON";
            waitingForConfirmation = true;
            sendMQTTCommand(nextState);
        }

        function sendMQTTCommand(state) {
            let msg = new Paho.MQTT.Message(state);
            msg.destinationName = "samnang/smarthome/led";
            client.send(msg);
        }

        function updateUI() {
            if (lightState === "ON") {
                document.body.classList.add("light-active");
                hintText.innerHTML = "Actual LED: <span style='color: #fde047;'>TURNED ON 💡</span> (Tap to turn OFF)";
            } else {
                document.body.classList.remove("light-active");
                hintText.innerHTML = "Actual LED: <span style='color: #38bdf8;'>TURNED OFF 🌙</span> (Tap to turn ON)";
            }
        }
    </script>
</body>
</html>
