<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Pro HUD</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.75);
            --border-glow: rgba(56, 189, 248, 0.2);
            --accent-cyan: #38bdf8;
            --accent-amber: #f59e0b;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        /* Header Bar */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 28px; background: var(--panel-bg);
            border-bottom: 1px solid var(--border-glow);
            backdrop-filter: blur(12px);
        }
        .app-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--accent-cyan); letter-spacing: 1px; }
        .meta-info { display: flex; gap: 20px; font-size: 0.85rem; color: var(--text-sub); }
        .status-badge { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; }

        /* Main Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 20px; padding: 20px; flex: 1;
        }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        /* Glassmorphism Cards */
        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px; padding: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .card-title {
            font-size: 0.85rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-sub); margin-bottom: 16px;
        }

        /* Quick Scenes */
        .scene-buttons { display: flex; flex-direction: column; gap: 10px; }
        .btn-scene {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main); font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-scene:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-cyan); }

        /* Center Villa Map */
        .villa-view { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .villa-view svg { width: 100%; max-width: 440px; }

        /* Device Control Cards */
        .device-list { display: flex; flex-direction: column; gap: 12px; }
        .device-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px; border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .device-info { display: flex; align-items: center; gap: 12px; }
        .device-icon { font-size: 1.3rem; }
        .device-name { font-weight: 600; font-size: 0.9rem; }
        .device-sub { font-size: 0.75rem; color: var(--text-sub); }

        /* Toggle Switches */
        .switch {
            position: relative; display: inline-block; width: 44px; height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #374151; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent-cyan); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Voice Bar */
        .voice-bar {
            grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-bg); padding: 12px 24px; border-radius: 16px;
            border: 1px solid var(--border-glow);
        }
        .voice-btn {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            border: none; color: white; padding: 10px 20px; border-radius: 20px;
            font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">SMART VILLA CONTROL</div>
        <div class="meta-info">
            <span id="dateDisplay">-- --- ----</span>
            <span id="timeDisplay">--:--:--</span>
            <span id="weatherDisplay">🌡️ 28°C (Phnom Penh)</span>
            <div class="status-badge"><div class="dot"></div> Online</div>
        </div>
    </header>

    <div class="dashboard-grid">
        <!-- Left Column: Quick Routines -->
        <div class="card">
            <div class="card-title">Quick Routines</div>
            <div class="scene-buttons">
                <button class="btn-scene" onclick="applyScene('ALL_ON')">
                    <span>💡 All Lights On</span> ➔
                </button>
                <button class="btn-scene" onclick="applyScene('NIGHT')">
                    <span>🌙 Good Night</span> ➔
                </button>
                <button class="btn-scene" onclick="applyScene('AWAY')">
                    <span>🔒 Leave Home</span> ➔
                </button>
            </div>
        </div>

        <!-- Center Column: Villa Interactive Overview -->
        <div class="card villa-view">
            <div class="card-title">Villa Overview Map</div>
            <svg viewBox="0 0 500 350">
                <polygon points="250,320 420,230 250,140 80,230" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
                <polygon class="iso-wall-dark" points="140,200 250,255 250,140 140,85" fill="#1e293b"/>
                <polygon class="iso-wall-light" points="250,255 360,200 360,85 250,140" fill="#334155"/>
                <polygon points="130,80 250,135 370,75 250,20" fill="#0f172a"/>
                <polygon id="livingRoomGlow" points="160,180 230,215 230,185 160,150" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8"/>
                <polygon id="bedroomGlow" points="270,200 340,165 340,135 270,170" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8"/>
            </svg>
        </div>

        <!-- Right Column: Device Controls -->
        <div class="card">
            <div class="card-title">Connected Devices</div>
            <div class="device-list">
                <!-- Device 1 -->
                <div class="device-card">
                    <div class="device-info">
                        <span class="device-icon">💡</span>
                        <div>
                            <div class="device-name">Living Room Light</div>
                            <div class="device-sub" id="status-living">State: OFF</div>
                        </div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-living" onchange="toggleDevice('samnang/smarthome/led', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Device 2 -->
                <div class="device-card">
                    <div class="device-info">
                        <span class="device-icon">🛏️</span>
                        <div>
                            <div class="device-name">Bedroom Light</div>
                            <div class="device-sub" id="status-bedroom">State: OFF</div>
                        </div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-bedroom" onchange="toggleDevice('samnang/smarthome/bedroom', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Bottom Voice Control Bar -->
        <div class="voice-bar">
            <div style="font-size: 0.88rem; color: var(--text-sub);" id="voiceHint">
                Voice Assist: Click button and say "Turn on living room light" or "Good night".
            </div>
            <button class="voice-btn" onclick="startListening()">
                <span>🎤</span> Voice Control
            </button>
        </div>
    </div>

    <script>
        // Update Time
        function updateClock() {
            const now = new Date();
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('timeDisplay').innerText = now.toLocaleTimeString('en-US');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // MQTT Setup
        const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "/mqtt", "web_client_" + parseInt(Math.random() * 100000));

        client.connect({
            useSSL: true,
            onSuccess: function() {
                client.subscribe("samnang/smarthome/led/status");
                client.subscribe("samnang/smarthome/bedroom/status");
            }
        });

        client.onMessageArrived = function(message) {
            const topic = message.destinationName;
            const payload = message.payloadString;

            if (topic === "samnang/smarthome/led/status") {
                const isChecked = payload === "ON";
                document.getElementById('toggle-living').checked = isChecked;
                document.getElementById('status-living').innerText = "State: " + payload;
                document.getElementById('livingRoomGlow').style.fill = isChecked ? "rgba(245, 158, 11, 0.8)" : "rgba(56, 189, 248, 0.2)";
            }
        };

        function toggleDevice(topic, state) {
            const msg = new Paho.MQTT.Message(state ? "ON" : "OFF");
            msg.destinationName = topic;
            client.send(msg);
        }

        function applyScene(scene) {
            if (scene === 'ALL_ON') {
                toggleDevice('samnang/smarthome/led', true);
            } else if (scene === 'NIGHT' || scene === 'AWAY') {
                toggleDevice('samnang/smarthome/led', false);
            }
        }

        function startListening() {
            if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SpeechRecognition();
                rec.lang = 'en-US';
                rec.onresult = function(e) {
                    const text = e.results[0][0].transcript.toLowerCase();
                    document.getElementById('voiceHint').innerText = 'Heard: "' + text + '"';
                    if (text.includes("on")) toggleDevice('samnang/smarthome/led', true);
                    if (text.includes("off") || text.includes("night")) toggleDevice('samnang/smarthome/led', false);
                };
                rec.start();
            }
        }
    </script>
</body>
</html>
