<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Home Dashboard with Voice</title> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1b8fb0 0%, #30acc9 70%, #6cd2ea 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow: hidden; touch-action: manipulation;
        }

        .top-header {
            position: absolute; top: 15px;
            display: flex; flex-direction: column; align-items: center;
            background: rgba(0, 0, 0, 0.3); padding: 6px 16px;
            border-radius: 12px; backdrop-filter: blur(5px); color: white;
            border: 1px solid rgba(255,255,255,0.2); z-index: 100;
        }
        .main-title { font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .status-text { font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; margin-top: 2px; }
        .dot { height: 6px; width: 6px; border-radius: 50%; margin-right: 5px; }
        .dot-green { background-color: #34d399; box-shadow: 0 0 6px #34d399; }
        .dot-red { background-color: #ef4444; }

        .side-card {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.35); padding: 12px 16px;
            border-radius: 14px; backdrop-filter: blur(6px); color: white;
            border: 1px solid rgba(255,255,255,0.2); text-align: center; z-index: 90;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .left-card { left: 20px; }
        .right-card { right: 20px; }

        .card-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }
        .card-value { font-size: 1rem; font-weight: 700; margin-top: 4px; color: #fde047; }

        .house-container {
            position: relative; width: 85%; max-width: 480px;
            cursor: pointer; transition: transform 0.2s ease;
        }
        .house-container:active { transform: scale(0.97); }

        svg { width: 100%; height: auto; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.25)); }

        .window-pane { fill: #475569; transition: 0.4s ease; }
        .house-body { fill: #f3f4f6; transition: 0.4s ease; }
        .roof { fill: #334155; transition: 0.4s ease; }
        .glow-effect { opacity: 0; transition: 0.4s ease; }

        /* Default OFF State */
        .sleeping-dog { display: block; }
        .awake-dog { display: none; }
        .sleep-z { animation: floatZ 2s infinite ease-in-out; }
        @keyframes floatZ {
            0% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
            50% { transform: translateY(-10px) scale(1.1); opacity: 1; }
            100% { transform: translateY(-20px) scale(0.9); opacity: 0; }
        }
        .butterfly { opacity: 0; transition: opacity 0.3s ease; }

        /* Active ON State */
        .house-on .window-pane { fill: #fde047; filter: drop-shadow(0 0 12px #facc15); }
        .house-on .house-body { fill: #fffbeb; }
        .house-on .roof { fill: #475569; }
        .house-on .glow-effect { opacity: 1; }

        .house-on .sleeping-dog { display: none; }
        .house-on .awake-dog { display: block; }

        .dog-tail { transform-origin: 360px 270px; animation: dogTailWag 0.4s infinite alternate ease-in-out; }
        @keyframes dogTailWag { 0% { transform: rotate(0deg); } 100% { transform: rotate(30deg); } }

        .house-on .butterfly { opacity: 1; animation: flyButterfly 3.5s infinite ease-in-out; }
        @keyframes flyButterfly {
            0% { transform: translate(0px, 0px) scale(1); }
            25% { transform: translate(25px, -25px) scale(1.1); }
            50% { transform: translate(45px, -10px) scale(0.95); }
            75% { transform: translate(20px, 10px) scale(1.05); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .hint-text {
            position: absolute; bottom: 20px;
            color: white; font-weight: 700; font-size: 0.95rem;
            background: rgba(0,0,0,0.4); padding: 10px 22px;
            border-radius: 20px; backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2); text-align: center;
        }

        .voice-btn {
            position: absolute; bottom: 75px;
            background: #fde047; color: #1e293b; border: none;
            padding: 8px 16px; border-radius: 15px; font-weight: 700;
            font-size: 0.8rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .voice-btn:active { transform: scale(0.95); }

        @media (max-width: 600px) {
            .side-card { top: auto; bottom: 110px; transform: none; padding: 8px 12px; }
            .left-card { left: 15px; }
            .right-card { right: 15px; }
            .card-value { font-size: 0.85rem; }
            .card-label { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <div class="top-header">
        <span class="main-title">Smart Home Control</span>
        <div id="status" class="status-text"><div class="dot dot-red"></div>Connecting...</div>
    </div>

    <!-- Left Card: Clock & Date -->
    <div class="side-card left-card">
        <div class="card-label">📅 Date & Time</div>
        <div class="card-value" id="dateDisplay">Loading...</div>
        <div class="card-value" id="timeDisplay" style="font-size: 1.1rem; color: #ffffff;">--:--:--</div>
    </div>

    <!-- Right Card: Temperature -->
    <div class="side-card right-card">
        <div class="card-label">🌡️ Temperature</div>
        <div class="card-value" id="weatherDisplay">--°C</div>
    </div>

    <!-- Center Interactive Cartoon House -->
    <div class="house-container" id="houseCard" onclick="toggleLight()">
        <svg id="houseSvg" viewBox="0 0 490 350" xmlns="http://www.w3.org/2000/svg">
            <circle class="glow-effect" cx="190" cy="180" r="140" fill="#fef08a" opacity="0.4" filter="blur(30px)"/>
            
            <polygon class="roof" points="190,40 50,130 330,130"/>
            <polygon class="roof" points="190,40 330,130 310,130 190,55" fill="#64748b" opacity="0.4"/>
            <rect class="house-body" x="80" y="130" width="220" height="170" rx="6"/>
            <rect x="165" y="210" width="50" height="90" rx="4" fill="#b45309"/>
            <circle cx="205" cy="255" r="4" fill="#fbbf24"/>
            <rect x="105" y="150" width="50" height="50" rx="6" fill="#1e293b"/>
            <rect class="window-pane" x="113" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="131" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="113" y="176" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="131" y="176" width="16" height="16" rx="2"/>
            <rect x="225" y="150" width="50" height="50" rx="6" fill="#1e293b"/>
            <rect class="window-pane" x="233" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="251" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="233" y="176" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="251" y="176" width="16" height="16" rx="2"/>
            <rect x="260" y="70" width="25" height="45" rx="3" fill="#94a3b8"/>

            <!-- SLEEPING PUPPY -->
            <g class="sleeping-dog">
                <ellipse cx="365" cy="280" rx="24" ry="16" fill="#ffffff"/>
                <ellipse cx="372" cy="275" rx="14" ry="10" fill="#b45309"/>
                <circle cx="342" cy="275" r="13" fill="#ffffff"/>
                <circle cx="338" cy="271" r="9" fill="#d97706"/>
                <ellipse cx="335" cy="282" rx="5" ry="9" fill="#92400e" transform="rotate(30 335 282)"/>
                <path d="M 338 273 Q 342 277 346 273" stroke="#451a03" stroke-width="1.5" fill="none"/>
                <text x="330" y="250" fill="#ffffff" font-size="14" font-weight="bold" class="sleep-z">Z</text>
                <text x="342" y="238" fill="#ffffff" font-size="12" font-weight="bold" class="sleep-z" style="animation-delay: 0.7s;">z</text>
            </g>

            <!-- AWAKE PUPPY -->
            <g class="awake-dog">
                <path class="dog-tail" d="M 360 275 Q 375 260 370 245" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none"/>
                <ellipse cx="345" cy="270" rx="16" ry="22" fill="#ffffff"/>
                <path d="M 342 252 Q 362 265 355 285 Q 345 280 342 252" fill="#78350f"/>
                <circle cx="345" cy="232" r="16" fill="#ffffff"/>
                <path d="M 329 230 Q 335 218 340 220 Q 338 238 329 230" fill="#b45309"/>
                <path d="M 361 230 Q 355 218 350 220 Q 352 238 361 230" fill="#b45309"/>
                <ellipse cx="326" cy="235" rx="7" ry="13" fill="#92400e" transform="rotate(-20 326 235)"/>
                <ellipse cx="364" cy="235" rx="7" ry="13" fill="#92400e" transform="rotate(20 364 235)"/>
                <circle cx="338" cy="230" r="3.5" fill="#451a03"/>
                <circle cx="337" cy="229" r="1.2" fill="#fff"/>
                <circle cx="352" cy="230" r="3.5" fill="#451a03"/>
                <circle cx="351" cy="229" r="1.2" fill="#fff"/>
                <ellipse cx="345" cy="236" rx="3.5" ry="2.2" fill="#1e293b"/>
                <path d="M 341 240 Q 345 246 349 240" fill="#f43f5e"/>
            </g>

            <!-- BUTTERFLY -->
            <g class="butterfly">
                <ellipse cx="380" cy="205" rx="7" ry="4" fill="#ec4899" transform="rotate(-30 380 205)"/>
                <ellipse cx="392" cy="205" rx="7" ry="4" fill="#ec4899" transform="rotate(30 392 205)"/>
                <ellipse cx="381" cy="213" rx="5" ry="3" fill="#f43f5e" transform="rotate(20 381 213)"/>
                <ellipse cx="391" cy="213" rx="5" ry="3" fill="#f43f5e" transform="rotate(-20 391 213)"/>
                <line x1="386" y1="202" x2="386" y2="214" stroke="#1e293b" stroke-width="2"/>
                <circle cx="386" cy="201" r="1.5" fill="#1e293b"/>
            </g>
        </svg>
    </div>

    <!-- Voice Control Button & Status -->
    <button class="voice-btn" onclick="startListening()">🎤 Tap to Speak</button>
    <div class="hint-text" id="hintText">Actual LED: Syncing...</div>

    <script>
        // --- Text-to-Speech Voice Report Function ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- Speech Recognition (Voice Commands & Questions) ---
        let recognition;
        let waitingForConfirmation = false;

        function initVoiceRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (window.SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onresult = function(event) {
                    let speechWord = event.results[0][0].transcript.toLowerCase().trim();
                    console.log("Heard speech: " + speechWord);
                    
                    if (speechWord.includes("light on") || speechWord.includes("turn on")) {
                        waitingForConfirmation = true;
                        sendMQTTCommand("ON");
                    } 
                    else if (speechWord.includes("light off") || speechWord.includes("turn off")) {
                        waitingForConfirmation = true;
                        sendMQTTCommand("OFF");
                    } 
                    else if (speechWord.includes("status") || speechWord.includes("is the light") || speechWord.includes("light condition")) {
                        if (lightState === "ON") {
                            speak("The light is currently turned on.");
                        } else if (lightState === "OFF") {
                            speak("The light is currently turned off.");
                        } else {
                            speak("Status is currently unknown.");
                        }
                    } 
                    else {
                        speak("Command not recognized. Say light on, light off, or check status.");
                    }
                };

                recognition.onerror = function(event) {
                    console.log("Speech recognition error", event.error);
                };
            }
        }

        function startListening() {
            if (recognition) {
                try {
                    recognition.start();
                    speak("Listening");
                } catch(e) { console.log(e); }
            } else {
                alert("Speech recognition is not supported in this browser. Try Google Chrome.");
            }
        }

        initVoiceRecognition();

        // --- Live Clock & Date Script ---
        function updateDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById("dateDisplay").innerText = dateStr;
            document.getElementById("timeDisplay").innerText = timeStr;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // --- Live Weather Fetcher ---
        async function fetchWeather() {
            try {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const data = await res.json();
                    document.getElementById("weatherDisplay").innerText = `${data.current_weather.temperature}°C`;
                }, () => {
                    document.getElementById("weatherDisplay").innerText = "28°C";
                });
            } catch (e) {
                document.getElementById("weatherDisplay").innerText = "28°C";
            }
        }
        fetchWeather();

        // --- MQTT Cloud Connection ---
        const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "/mqtt", "web_cartoon_" + parseInt(Math.random() * 100000));
        let lightState = "UNKNOWN";
        let hasSpokenInitialStatus = false;

        const statusEl = document.getElementById("status");
        const houseCard = document.getElementById("houseCard");
        const hintText = document.getElementById("hintText");

        client.onConnectionLost = function(responseObject) {
            statusEl.innerHTML = '<div class="dot dot-red"></div>Disconnected';
            hintText.innerText = "Actual LED: Disconnected 🔴";
            speak("System disconnected from cloud network.");
        };

        client.onMessageArrived = function(message) {
            lightState = message.payloadString;
            updateUI();

            if (!hasSpokenInitialStatus) {
                hasSpokenInitialStatus = true;
                if (lightState === "ON") {
                    speak("System connected online. Light is currently turned on.");
                } else {
                    speak("System connected online. Light is currently turned off.");
                }
            } 
            else if (waitingForConfirmation) {
                waitingForConfirmation = false;
                if (lightState === "ON") {
                    speak("Confirmed. Light is now turned on.");
                } else {
                    speak("Confirmed. Light is now turned off.");
                }
            }
        };

        client.connect({
            useSSL: true,
            timeout: 5,
            onSuccess: function() {
                statusEl.innerHTML = '<div class="dot dot-green"></div>Connected Online';
                client.subscribe("samnang/smarthome/led/status");

                let reqMsg = new Paho.MQTT.Message("GET");
                reqMsg.destinationName = "samnang/smarthome/led/get";
                client.send(reqMsg);
            },
            onFailure: function(err) {
                statusEl.innerHTML = '<div class="dot dot-red"></div>Connection Failed';
                hintText.innerText = "Actual LED: Offline ❌";
                speak("Connection failed. Please check network connection.");
            }
        });

        function toggleLight() {
            let nextState = (lightState === "ON") ? "OFF" : "ON";
            waitingForConfirmation = true;
            sendMQTTCommand(nextState);
        }

        function sendMQTTCommand(state) {
            let msg = new Paho.MQTT.Message(state);
            msg.destinationName = "samnang/smarthome/led";
            client.send(msg);
        }

        function updateUI() {
            if (lightState === "ON") {
                houseCard.classList.add("house-on");
                hintText.innerHTML = "Actual LED: <span style='color: #fde047;'>TURNED ON 💡</span> (Tap to turn OFF)";
            } else {
                houseCard.classList.remove("house-on");
                hintText.innerHTML = "Actual LED: <span style='color: #94a3b8;'>TURNED OFF 🌙</span> (Tap to turn ON)";
            }
        }
    </script>
</body>
</html>
