<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Home Dashboard</title> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1b8fb0 0%, #30acc9 70%, #6cd2ea 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Top Title & Cloud Status */
        .top-header {
            position: absolute; top: 15px;
            display: flex; flex-direction: column; align-items: center;
            background: rgba(0, 0, 0, 0.3); padding: 6px 16px;
            border-radius: 12px; backdrop-filter: blur(5px); color: white;
            border: 1px solid rgba(255,255,255,0.2); z-index: 100;
        }
        .main-title { font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .status-text { font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; margin-top: 2px; }
        .dot { height: 6px; width: 6px; border-radius: 50%; margin-right: 5px; }
        .dot-green { background-color: #34d399; box-shadow: 0 0 6px #34d399; }
        .dot-red { background-color: #ef4444; }

        /* Left and Right Side Cards */
        .side-card {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.35);
            padding: 12px 16px;
            border-radius: 14px;
            backdrop-filter: blur(6px);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            z-index: 90;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .left-card { left: 20px; }
        .right-card { right: 20px; }

        .card-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }
        .card-value { font-size: 1rem; font-weight: 700; margin-top: 4px; color: #fde047; }

        /* Cartoon House Container (Center) */
        .house-container {
            position: relative;
            width: 85%;
            max-width: 400px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .house-container:active { transform: scale(0.97); }

        /* SVG Cartoon House Animation */
        svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.25));
        }

        .window-pane { fill: #475569; transition: 0.4s ease; }
        .house-body { fill: #f3f4f6; transition: 0.4s ease; }
        .roof { fill: #334155; transition: 0.4s ease; }
        .glow-effect { opacity: 0; transition: 0.4s ease; }

        /* ON State (Warm Glowing House) */
        .house-on .window-pane { fill: #fde047; filter: drop-shadow(0 0 12px #facc15); }
        .house-on .house-body { fill: #fffbeb; }
        .house-on .roof { fill: #475569; }
        .house-on .glow-effect { opacity: 1; }

        /* --- Cartoon Cat Animation --- */
        .cat-tail {
            transform-origin: 325px 275px;
            transition: 0.4s ease;
        }
        .cat-ears {
            transition: 0.3s ease;
        }
        /* When house is ON, cat wags its tail happily */
        .house-on .cat-tail {
            animation: catTailWag 0.8s infinite alternate ease-in-out;
        }
        @keyframes catTailWag {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-25deg); }
        }

        /* Hint Text at Bottom */
        .hint-text {
            position: absolute; bottom: 20px;
            color: white; font-weight: 600; font-size: 0.9rem;
            background: rgba(0,0,0,0.3); padding: 8px 18px;
            border-radius: 20px; backdrop-filter: blur(4px);
        }

        /* Responsive adjustments for phones in portrait mode */
        @media (max-width: 600px) {
            .side-card { top: auto; bottom: 75px; transform: none; padding: 8px 12px; }
            .left-card { left: 15px; }
            .right-card { right: 15px; }
            .card-value { font-size: 0.85rem; }
            .card-label { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <div class="top-header">
        <span class="main-title">Smart Home Control</span>
        <div id="status" class="status-text"><div class="dot dot-red"></div>Connecting...</div>
    </div>

    <!-- Left Card: Clock & Date -->
    <div class="side-card left-card">
        <div class="card-label">📅 Date & Time</div>
        <div class="card-value" id="dateDisplay">Loading...</div>
        <div class="card-value" id="timeDisplay" style="font-size: 1.1rem; color: #ffffff;">--:--:--</div>
    </div>

    <!-- Right Card: Temperature -->
    <div class="side-card right-card">
        <div class="card-label">🌡️ Temperature</div>
        <div class="card-value" id="weatherDisplay">--°C</div>
    </div>

    <!-- Center Interactive Cartoon House with Animated Cat -->
    <div class="house-container" id="houseCard" onclick="toggleLight()">
        <svg id="houseSvg" viewBox="0 0 420 350" xmlns="http://www.w3.org/2000/svg">
            <circle class="glow-effect" cx="190" cy="180" r="140" fill="#fef08a" opacity="0.4" filter="blur(30px)"/>
            
            <!-- House Structure -->
            <polygon class="roof" points="190,40 50,130 330,130"/>
            <polygon class="roof" points="190,40 330,130 310,130 190,55" fill="#64748b" opacity="0.4"/>
            <rect class="house-body" x="80" y="130" width="220" height="170" rx="6"/>
            <rect x="165" y="210" width="50" height="90" rx="4" fill="#b45309"/>
            <circle cx="205" cy="255" r="4" fill="#fbbf24"/>
            <rect x="105" y="150" width="50" height="50" rx="6" fill="#1e293b"/>
            <rect class="window-pane" x="113" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="131" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="113" y="176" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="131" y="176" width="16" height="16" rx="2"/>
            <rect x="225" y="150" width="50" height="50" rx="6" fill="#1e293b"/>
            <rect class="window-pane" x="233" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="251" y="158" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="233" y="176" width="16" height="16" rx="2"/>
            <rect class="window-pane" x="251" y="176" width="16" height="16" rx="2"/>
            <rect x="260" y="70" width="25" height="45" rx="3" fill="#94a3b8"/>

            <!-- CARTOON CAT (Sitting outside on the right) -->
            <g class="cartoon-cat">
                <!-- Tail -->
                <path class="cat-tail" d="M 325 275 Q 350 260 345 235" stroke="#f97316" stroke-width="6" stroke-linecap="round" fill="none"/>
                <!-- Paws -->
                <ellipse cx="308" cy="295" rx="5" ry="3" fill="#f97316"/>
                <ellipse cx="322" cy="295" rx="5" ry="3" fill="#f97316"/>
                <!-- Body -->
                <ellipse cx="315" cy="270" rx="16" ry="24" fill="#fb923c"/>
                <ellipse cx="315" cy="272" rx="10" ry="16" fill="#ffedd5"/>
                <!-- Head -->
                <circle cx="315" cy="235" r="18" fill="#fb923c"/>
                <!-- Ears -->
                <polygon class="cat-ears" points="300,225 305,205 313,220" fill="#f97316"/>
                <polygon class="cat-ears" points="302,223 306,209 311,220" fill="#fdba74"/>
                <polygon class="cat-ears" points="330,225 325,205 317,220" fill="#f97316"/>
                <polygon class="cat-ears" points="328,223 324,209 319,220" fill="#fdba74"/>
                <!-- Eyes -->
                <circle cx="309" cy="233" r="3.5" fill="#0284c7"/>
                <circle cx="308" cy="232" r="1" fill="#fff"/>
                <circle cx="321" cy="233" r="3.5" fill="#0284c7"/>
                <circle cx="320" cy="232" r="1" fill="#fff"/>
                <!-- Nose & Mouth -->
                <polygon points="313,238 317,238 315,240" fill="#f43f5e"/>
                <path d="M 312 242 Q 315 245 315 242 Q 315 245 318 242" stroke="#7c2d12" stroke-width="1.2" fill="none"/>
                <!-- Whiskers -->
                <line x1="298" y1="237" x2="290" y2="235" stroke="#7c2d12" stroke-width="1"/>
                <line x1="298" y1="240" x2="288" y2="241" stroke="#7c2d12" stroke-width="1"/>
                <line x1="332" y1="237" x2="340" y2="235" stroke="#7c2d12" stroke-width="1"/>
                <line x1="332" y1="240" x2="342" y2="241" stroke="#7c2d12" stroke-width="1"/>
            </g>
        </svg>
    </div>

    <div class="hint-text" id="hintText">Tap house to TURN ON 💡</div>

    <script>
        // --- Live Clock & Date Script ---
        function updateDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById("dateDisplay").innerText = dateStr;
            document.getElementById("timeDisplay").innerText = timeStr;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // --- Live Weather Fetcher ---
        async function fetchWeather() {
            try {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const data = await res.json();
                    document.getElementById("weatherDisplay").innerText = `${data.current_weather.temperature}°C`;
                }, () => {
                    document.getElementById("weatherDisplay").innerText = "28°C";
                });
            } catch (e) {
                document.getElementById("weatherDisplay").innerText = "28°C";
            }
        }
        fetchWeather();

        // --- MQTT Cloud Connection ---
        const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "/mqtt", "web_cartoon_" + parseInt(Math.random() * 100000));
        let lightState = "OFF";

        const statusEl = document.getElementById("status");
        const houseCard = document.getElementById("houseCard");
        const hintText = document.getElementById("hintText");

        client.onConnectionLost = function(responseObject) {
            statusEl.innerHTML = '<div class="dot dot-red"></div>Disconnected';
        };

        client.onMessageArrived = function(message) {
            lightState = message.payloadString;
            updateUI();
        };

        client.connect({
            useSSL: true,
            timeout: 5,
            onSuccess: function() {
                statusEl.innerHTML = '<div class="dot dot-green"></div>Connected Online';
                client.subscribe("samnang/smarthome/led/status");
            },
            onFailure: function(err) {
                statusEl.innerHTML = '<div class="dot dot-red"></div>Connection Failed';
            }
        });

        function toggleLight() {
            let nextState = (lightState === "OFF") ? "ON" : "OFF";
            let msg = new Paho.MQTT.Message(nextState);
            msg.destinationName = "samnang/smarthome/led";
            client.send(msg);
        }

        function updateUI() {
            if (lightState === "ON") {
                houseCard.classList.add("house-on");
                hintText.innerText = "House is ON ✨ (Tap to turn OFF)";
            } else {
                houseCard.classList.remove("house-on");
                hintText.innerText = "House is OFF 🌙 (Tap to turn ON)";
            }
        }
    </script>
</body>
</html>
